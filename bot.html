<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bot</title>
    <style>
        body {
            background-image: url('robot.gif');
            background-position: bottom right;
            background-size: 600px 600px;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .margin {
            height: 100%;
            width: 350px;
            background-color: #C90202;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
        }

        .margin img {
            display: block;
            margin: 10px auto;
        }

        .chat-container {
            margin-left: 370px;
            margin-top: 20px;
            max-width: 600px;
            height: 600px;
            background: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .messages {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .messages .message {
            margin: 5px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 75%;
        }

        .messages .user {
            background: #C90202;
            color: white;
            align-self: flex-end;
        }

        .messages .bot {
            background: #ddd;
            color: black;
            align-self: flex-start;
        }

        .typing-indicator {
            text-align: left;
            color: #555;
            font-size: 14px;
            font-style: italic;
        }

        .input-container {
            display: flex;
            align-items: center;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        .input-container input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
        }

        .input-container button {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background-color: #C90202;
            color: white;
            cursor: pointer;
        }

        .input-container button:hover {
            background-color: #a10101;
        }

        .clear-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #C90202;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .clear-btn:hover {
            background-color: #a10101;
        }
    </style>
</head>
<body>
    <div class="margin">
        <img src="home-icon.png" alt="home" height="45px" width="45px">
        <img src="contact-icon.png" alt="contact" height="45px" width="45px">
        <img src="report-icon.png" alt="report" height="45px" width="45px">
        <img src="save-icon.png" alt="save" height="45px" width="45px">
    </div>

    <div class="chat-container">
        <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
        <div class="messages" id="chatMessages"></div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const userMessage = document.getElementById("userInput").value;
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: userMessage }),
            });
            const data = await response.json();
            document.getElementById("chatArea").innerHTML += `<p><b>You:</b> ${userMessage}</p>`;
            document.getElementById("chatArea").innerHTML += `<p><b>Bot:</b> ${data.response}</p>`;
            document.getElementById("userInput").value = '';
        }
    </script>
    
    
    
</body>
</html>
